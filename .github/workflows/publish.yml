name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required for the npm provenance attestation

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: npm

      # Pinned to npm 11 on purpose:
      #   - npm >= 11.5.1 is required by npm trusted publishing (OIDC).
      #   - npm 12 changed `npm pack --dry-run --json` from an array to an
      #     object keyed by package name, which scripts/validate-package.js
      #     does not accept yet.
      - name: Use npm 11
        run: npm install --global npm@11

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Validate package
        run: npm run lint

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      # --ignore-scripts skips the prepack hook, which runs the jest suite.
      # The test directory is not part of this repository, so the suite cannot
      # run here; build and validation above cover the published artifact.
      - name: Publish
        run: npm publish --provenance --access public --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_THORDATA }}
